name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A PR's newer run replaces its older one. Each push to main gets its own group, so none is queued behind
# another and dropped: every push is gate-checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Install the pinned build dependencies (from package-lock.json)
        run: npm ci
      - name: Tests (engine, pins, contract, golden snapshot, hooks, workflow rules, page build)
        run: npm test
      - name: Change gate (emitted data needs a reason on record)
        if: ${{ !cancelled() }}
        env:
          GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tools/ci/change-gate.js

  # The checks on the built site, beside the tests: no unit test reads dist/, and neither reads the other's output.
  dist:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Install the pinned build dependencies (from package-lock.json)
        run: npm ci
      - name: Build the site
        run: make build
      - name: Size budget (brotli weight per page type)
        run: node tools/ci/size-budget.js
      - name: Link check (every internal link and fragment in dist/ resolves)
        if: ${{ !cancelled() }}
        run: node tools/ci/link-check.js

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Install the pinned build dependencies (from package-lock.json)
        run: npm ci
      # Chromium only, the version the lockfile's Playwright pins (npx runs the local copy). The Linux libraries it
      # needs come from apt, which Playwright runs through sudo itself; hosted runners allow sudo without a password.
      # Firefox and WebKit are not installed here: `npm run e2e:launch` runs all three engines before a launch.
      - name: Install Chromium and its system libraries
        run: npx playwright install --with-deps chromium
      - name: Build the site
        run: make build
      # Actions sets CI=true, so tools/e2e/lib.js runs this Chromium, not an installed Google Chrome. One file and one tab
      # at a time (tools/e2e/concurrency.js): the runner's core count changes with the repository's visibility, and more
      # at once timed out the heaviest pages. About 17 minutes; the limit leaves room.
      - name: Browser checks (pages, interaction, watch, accessibility)
        env:
          E2E_CONCURRENCY: '1'
        run: npm run e2e

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.15'
      - name: Python tests (validator, contract, hospital master, golden snapshot, TDR names)
        run: python -I pipeline/py/run.py test

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (release tarball, SHA-256 checked)
        run: |
          cd "$RUNNER_TEMP"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - name: Scan full history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner .'
